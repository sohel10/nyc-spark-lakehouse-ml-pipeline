name: Spark Pipeline CI-CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  # =========================
  # CI (LIGHT CHECKS ONLY)
  # =========================
  CI:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 🔥 DO NOT RUN HEAVY SPARK HERE
      - name: Validate pipeline code
        run: |
          python -m py_compile run_pipeline.py

      - name: Run Tests
        run: |
          pytest || echo "No tests yet"


  # =========================
  # CD (DEPLOY + AIRFLOW)
  # =========================
  CD:
    needs: CI
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            set +e

            echo "🚀 Deploying..."

            cd ~/nyc-deploy

            git pull origin main

            echo "📂 Copy DAGs"
            mkdir -p ~/airflow/dags
            cp ~/nyc-deploy/dags/*.py ~/airflow/dags/

            echo "🔁 Restart API"
            pkill -f uvicorn > /dev/null 2>&1
            sleep 2
            nohup uvicorn ml.api:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &

            echo "🧠 Trigger Airflow"

            # 🔥 IMPORTANT: load environment
            source ~/.bashrc

            export AIRFLOW_HOME=~/airflow
            airflow dags trigger nyc_taxi_pipeline > /dev/null 2>&1

            echo "✅ Done"